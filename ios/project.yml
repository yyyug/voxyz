name: Voxyz
options:
  bundleIdPrefix: com.vozxyz
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: true

packages:
  GRDB.swift:
    url: https://github.com/groue/GRDB.swift.git
    from: "7.0.0"
  llama.cpp:
    url: https://github.com/ggerganov/llama.cpp.git
    branch: master

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  Voxyz:
    type: application
    platform: iOS
    sources:
      - Voxyz/App
      - Voxyz/Models
      - Voxyz/Services
      - Voxyz/ViewModels
      - Voxyz/Views
      - Voxyz/Utilities
    info:
      path: Voxyz/Info.plist
      properties:
        CFBundleDisplayName: Voxyz
        CFBundleShortVersionString: "1.0.0"
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Voxyz needs microphone access to record and transcribe audio."
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vozxyz.app
        INFOPLIST_FILE: Voxyz/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: GRDB.swift
        product: GRDB
      - package: llama.cpp
        product: llama
